<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- LA PUERTA DE rashferro.com.
     Este dominio es el de la linea de accesorios, asi que al entrar pelado
     (rashferro.com) se abre la GORRA, no la pagina de caballos.
     La pagina de caballos no se ha perdido: esta en caballos.html.

     GitHub Pages no tiene servidor, no puede hacer un redirect de verdad (301),
     asi que se hace con las tres lineas de abajo: la etiqueta refresh (funciona
     siempre, aunque el javascript este apagado), el canonical (le dice a Google
     cual es la pagina buena) y el location.replace (es el que salta primero y
     NO deja rastro en el boton Atras del movil). -->
<title>RASH Ferro</title>
<meta name="robots" content="noindex,follow" />
<link rel="canonical" href="https://rashferro.com/gorra.html" />
<meta http-equiv="refresh" content="0; url=gorra.html" />

<!-- FICHA AL COMPARTIR EL ENLACE PELADO (rashferro.com).
     Sin esto, mandar rashferro.com por WhatsApp sale sin foto aunque
     rashferro.com/gorra.html si la tenga. Son las mismas de la gorra. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="RASH Ferro" />
<meta property="og:title" content="Xanthos y Balios · gorras RASH Ferro" />
<meta property="og:description" content="Edición corta hecha por encargo. Seis paneles, hilo plata, visera plana o curva. Desde 55 €." />
<meta property="og:url" content="https://rashferro.com/gorra.html" />
<meta property="og:image" content="https://rashferro.com/img/og-gorra.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Gorra RASH negra con la cabeza de caballo bordada en hilo plata" />
<meta property="og:locale" content="es_ES" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="icon" type="image/png" sizes="512x512" href="img/favicon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="img/favicon-180.png" />
<meta name="theme-color" content="#020203" />

<style>
  /* Negro desde el primer milisegundo: asi el salto no da un flashazo blanco. */
  html,body{margin:0;height:100%;background:#020203;}
  a{color:#c9bfae;font:300 15px/1.6 system-ui,sans-serif;
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
</style>
<script>location.replace('gorra.html' + location.search + location.hash);</script>
</head>
<body>
  <a href="gorra.html">Entrar &rsaquo;</a>
</body>
</html>
